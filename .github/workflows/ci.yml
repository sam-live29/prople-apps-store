name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Check & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: 🔍 Typecheck & Lint
        run: |
          npm run lint

      - name: 🏗️ Production Build (Client SPA & Bundled Server)
        run: |
          npm run build

      - name: 🛡️ Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f dist/server.cjs || { echo "❌ dist/server.cjs missing"; exit 1; }
          echo "✅ All build artifacts verified successfully."
