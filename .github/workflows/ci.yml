name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Check & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: ⚡ Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-npm-

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: 🔍 Typecheck, Lint & Catalog Validation
        run: |
          npm run test:catalog
          npm run lint

      - name: 🏗️ Production Build (Client SPA & Bundled Server)
        run: |
          npm run build

      - name: 🛡️ Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          test -f dist/server.cjs || { echo "❌ dist/server.cjs missing"; exit 1; }
          echo "✅ All build artifacts verified successfully."
