# ==============================================================================
# Prople Store — Production Nginx Reverse Proxy Configuration
# Domain: prople.co.in & www.prople.co.in
# Upstream: Node.js / Express (server.ts / dist/server.cjs) on port 3000
# ==============================================================================

# Rate limiting zones to prevent API abuse and DoS attacks
limit_req_zone $binary_remote_addr zone=store_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=store_auth_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=store_conn_limit:10m;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Redirect all HTTP requests to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name prople.co.in www.prople.co.in;

    # Let's Encrypt ACME Challenge Directory for Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Production SSL Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prople.co.in www.prople.co.in;

    # SSL Certificates (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/prople.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prople.co.in/privkey.pem;

    # Modern TLS Security Configuration (Mozilla Modern Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling for faster TLS handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Maximum payload size for app binary uploads (APK, EXE, DMG, icons, screenshots)
    client_max_body_size 150M;
    client_body_buffer_size 16M;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 30s;
    keepalive_timeout 75s;
    send_timeout 60s;

    # Gzip Compression for text assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/manifest+json;

    # Global Reverse Proxy Defaults to Node.js Backend
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Connection limits per IP
    limit_conn store_conn_limit 30;

    # --------------------------------------------------------------------------
    # Location: Authentication & Sensitive API Endpoints (Strict Rate Limiting)
    # --------------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=store_auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # Location: General API Routes
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=store_api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # Location: Progressive Web App Service Worker (Must Never Be Cached by Proxy)
    # --------------------------------------------------------------------------
    location ~* ^/(sw\.js|firebase-messaging-sw\.js)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------------------------
    # Location: Web App Manifest
    # --------------------------------------------------------------------------
    location ~* ^/(manifest\.webmanifest|manifest\.json)$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Content-Type "application/manifest+json; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
    }

    # --------------------------------------------------------------------------
    # Location: Static Build Assets (Hashed JS, CSS, Fonts, Images)
    # --------------------------------------------------------------------------
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --------------------------------------------------------------------------
    # Location: Default App Catch-All & SSR SEO Pre-renderer
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
    }
}
